# Builds and tests on every push to main and every pull request.
#  - push to main  -> updates the rolling "nightly" pre-release with fresh app + CLI zips
#  - push a v* tag -> publishes a proper release for that tag (e.g. git tag v0.2.0 && git push origin v0.2.0)
#  - pull request  -> build + tests only
name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write   # needed to create/update releases

jobs:
  build:
    runs-on: macos-26   # Apple Silicon runner
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain
        run: |
          swift --version
          cmake --version | head -1

      - name: Cache whisper.cpp static libs
        uses: actions/cache@v4
        with:
          path: build/whisper/install
          key: whisper-${{ runner.os }}-${{ hashFiles('third_party/whisper.cpp/**', 'scripts/build_whisper.sh') }}

      - name: Unit tests
        run: scripts/test.sh

      - name: Build app bundle
        run: scripts/bundle_app.sh

      - name: Package
        id: pkg
        run: |
          VERSION="$(sed -n 's/^public let appVersion = "\(.*\)"/\1/p' Sources/TTSKit/Paths.swift)"
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            LABEL="${GITHUB_REF_NAME#v}"
          else
            LABEL="${VERSION}-${GITHUB_SHA::7}"
          fi
          mkdir -p dist
          ditto -c -k --keepParent "build/TTS Dataset Creator.app" "dist/TTS-Dataset-Creator-${LABEL}-macos-arm64.zip"
          ditto -c -k "build/TTS Dataset Creator.app/Contents/MacOS/ttsdc" "dist/ttsdc-${LABEL}-macos-arm64.zip"
          (cd dist && shasum -a 256 *.zip > SHA256SUMS.txt && cat SHA256SUMS.txt)
          echo "label=$LABEL" >> "$GITHUB_OUTPUT"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: tts-dataset-creator-${{ steps.pkg.outputs.label }}
          path: dist/*
          retention-days: 30

      - name: Update nightly pre-release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete nightly --cleanup-tag --yes || true
          gh release create nightly dist/* \
            --prerelease --target "$GITHUB_SHA" \
            --title "Nightly (${GITHUB_SHA::7})" \
            --notes "Automatic build of main at ${GITHUB_SHA}. Ad-hoc signed: right-click → Open on first launch, or run \`xattr -dr com.apple.quarantine\` on the app. For stable builds see the latest versioned release."

      - name: Publish tagged release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/* --clobber
          else
            gh release create "$GITHUB_REF_NAME" dist/* --title "$GITHUB_REF_NAME" --generate-notes
          fi
